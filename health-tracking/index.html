<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康站追蹤後台</title>
<meta name="description" content="彰基社區智慧健康站：量測異常紅橙黃綠分層管理與閉環追蹤後台">
<style>
:root {
  --bg: #f5f6f4; --surface: #fcfcfb; --surface-2: #f0f1ee; --line: #dfe1dc; --line-strong: #c6c9c2;
  --ink: #1d2320; --ink-2: #4a524d; --ink-3: #737b75; --accent: #1f4e79; --accent-ink: #fff; --focus: #2b6cb0;
  --lv-green: #2f9e5c; --lv-yellow: #e3bf1f; --lv-orange: #e2651b; --lv-red: #a5172f; --lv-na: #9aa19c;
  --lv-green-bg: #e3f3e9; --lv-yellow-bg: #fbf3cf; --lv-orange-bg: #fde6d8; --lv-red-bg: #f7dde2;
  --lv-green-ink: #1b6b3c; --lv-yellow-ink: #6e5a00; --lv-orange-ink: #9a3d07; --lv-red-ink: #8c1027;
  --warn-bg: #fff4e5; --warn-ink: #8a4b00; --danger: #b3261e;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121312; --surface: #1a1a19; --surface-2: #232422; --line: #30322f; --line-strong: #454844;
    --ink: #ecedea; --ink-2: #b9bdb7; --ink-3: #8b918a; --accent: #8cb8e8; --accent-ink: #0d1a28; --focus: #8cb8e8;
    --lv-green: #35a466; --lv-yellow: #d9b52e; --lv-orange: #e46a26; --lv-red: #c4234a; --lv-na: #6c716b;
    --lv-green-bg: #16301f; --lv-yellow-bg: #332b0c; --lv-orange-bg: #3a2010; --lv-red-bg: #3a1019;
    --lv-green-ink: #8fdcab; --lv-yellow-ink: #f0d878; --lv-orange-ink: #f8b48a; --lv-red-ink: #f6a3b5;
    --warn-bg: #3a2a10; --warn-ink: #f3c681; --danger: #f2877f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121312; --surface: #1a1a19; --surface-2: #232422; --line: #30322f; --line-strong: #454844;
  --ink: #ecedea; --ink-2: #b9bdb7; --ink-3: #8b918a; --accent: #8cb8e8; --accent-ink: #0d1a28; --focus: #8cb8e8;
  --lv-green: #35a466; --lv-yellow: #d9b52e; --lv-orange: #e46a26; --lv-red: #c4234a; --lv-na: #6c716b;
  --lv-green-bg: #16301f; --lv-yellow-bg: #332b0c; --lv-orange-bg: #3a2010; --lv-red-bg: #3a1019;
  --lv-green-ink: #8fdcab; --lv-yellow-ink: #f0d878; --lv-orange-ink: #f8b48a; --lv-red-ink: #f6a3b5;
  --warn-bg: #3a2a10; --warn-ink: #f3c681; --danger: #f2877f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ── 版面 ── */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1320px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .02em; margin-right: auto; }
.brand small { font-weight: 400; color: var(--ink-3); margin-left: 6px; font-size: 12px; }
.top-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
nav.tabs { width: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 8px 12px; text-decoration: none; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs a .badge { margin-left: 4px; }
main { max-width: 1320px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 4px 0 12px; }
h2 { font-size: 16px; margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0 0 8px; color: var(--ink-2); }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) 380px; }
@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3, .g2, .g-side { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 0; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn-ink); margin-bottom: 12px; }
.banner.danger { background: var(--lv-red-bg); color: var(--lv-red-ink); font-weight: 600; }

/* ── 層級標記：顏色＋文字，不只靠顏色 ── */
.lv { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.lv.green { --c: var(--lv-green); background: var(--lv-green-bg); color: var(--lv-green-ink); }
.lv.yellow { --c: var(--lv-yellow); background: var(--lv-yellow-bg); color: var(--lv-yellow-ink); }
.lv.orange { --c: var(--lv-orange); background: var(--lv-orange-bg); color: var(--lv-orange-ink); }
.lv.red { --c: var(--lv-red); background: var(--lv-red-bg); color: var(--lv-red-ink); }
.lv.na { --c: var(--lv-na); background: var(--surface-2); color: var(--ink-3); }
.dot { display: inline-block; width: 18px; height: 18px; border-radius: 5px; font-size: 10px; line-height: 18px; text-align: center; font-weight: 700; color: #fff; }
.dot.green { background: var(--lv-green); } .dot.yellow { background: var(--lv-yellow); color: #3a3000; } .dot.orange { background: var(--lv-orange); } .dot.red { background: var(--lv-red); } .dot.na, .dot.none { background: var(--surface-2); color: var(--ink-3); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.tag.bad { background: var(--lv-red-bg); color: var(--lv-red-ink); border-color: transparent; font-weight: 700; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; text-align: center; background: var(--lv-red); color: #fff; font-weight: 700; }

/* ── KPI ── */
.kpi { border-left: 4px solid var(--c, var(--line-strong)); }
.kpi .k-label { color: var(--ink-2); font-size: 13px; }
.kpi .k-val { font-size: 30px; font-weight: 700; line-height: 1.15; }
.kpi .k-sub { font-size: 12px; color: var(--ink-3); }
.kpi.green { --c: var(--lv-green); } .kpi.yellow { --c: var(--lv-yellow); } .kpi.orange { --c: var(--lv-orange); } .kpi.red { --c: var(--lv-red); }
.kpi a { text-decoration: none; color: inherit; }

/* ── 表格 ── */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--ink-3); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.overdue { color: var(--danger); font-weight: 700; }

/* ── 表單 ── */
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=search], select, textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 160px; font-family: inherit; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.form-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 10px; cursor: pointer; background: var(--surface); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }

/* ── 流程步驟 ── */
.stepper { display: flex; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.step { flex: 1 0 84px; text-align: center; font-size: 12px; color: var(--ink-3); position: relative; padding-top: 22px; }
.step::before { content: ""; position: absolute; top: 7px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); z-index: 1; }
.step::after { content: ""; position: absolute; top: 12px; left: -50%; width: 100%; height: 2px; background: var(--line-strong); }
.step:first-child::after { display: none; }
.step.done { color: var(--ink-2); } .step.done::before { background: var(--accent); border-color: var(--accent); } .step.done::after { background: var(--accent); }
.step.cur { color: var(--ink); font-weight: 700; } .step.cur::before { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.timeline li { padding: 4px 0 4px 14px; border-left: 2px solid var(--line); margin-left: 4px; }
.timeline time { color: var(--ink-3); font-size: 12px; margin-right: 6px; }

/* ── 圖表 ── */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .axis-t { fill: var(--ink-3); font-size: 11px; }
.chart .ref-l { stroke-width: 1; stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; z-index: 5; display: none; transform: translate(-50%, calc(-100% - 10px)); }
.bar-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.bar-row .track { display: flex; gap: 2px; height: 14px; }
.bar-row .seg { height: 100%; border-radius: 0; min-width: 2px; }
.bar-row .seg:first-child { border-radius: 4px 0 0 4px; } .bar-row .seg:last-child { border-radius: 0 4px 4px 0; } .bar-row .seg:only-child { border-radius: 4px; }
.seg.green { background: var(--lv-green); } .seg.yellow { background: var(--lv-yellow); } .seg.orange { background: var(--lv-orange); } .seg.red { background: var(--lv-red); } .seg.neutral { background: var(--accent); }

/* ── 對話框 ── */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog .d-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
dialog .d-body { padding: 16px; overflow: auto; }
dialog .d-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 50; display: none; }
.rx { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: 13px; }
details > summary { cursor: pointer; color: var(--ink-2); }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }

@media print {
  header.top, .no-print, nav { display: none !important; }
  body { background: #fff; color: #000; }
  .card { border: 0; box-shadow: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">社區智慧健康站・分層管理與閉環追蹤<small>彰化基督教醫院</small></div>
    <div class="top-tools">
      <label class="small muted" for="site-filter">據點</label>
      <select id="site-filter" aria-label="據點篩選"></select>
      <label class="small muted" for="user-sel">操作者</label>
      <select id="user-sel" aria-label="目前操作者"></select>
      <button class="btn sm" id="theme-btn" type="button" aria-label="切換深淺色">深色</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<dialog id="dlg"><form method="dialog" id="dlg-form"><div class="d-head"><strong id="dlg-title"></strong><button class="btn sm" value="cancel" formnovalidate>關閉</button></div><div class="d-body" id="dlg-body"></div><div class="d-foot" id="dlg-foot"></div></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="rx-library.js"></script>
<script src="engine.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
